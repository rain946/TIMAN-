services:
  db:
    image: mysql:8.0
    command: --default-time-zone=+08:00
    container_name: timan_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: timan_db

    ports:
      - "3306:3306"

    volumes:
      - timan_mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: timan_api
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: timan_db
      JWT_SECRET: timan_development_secret
      TZ: Asia/Manila
      NEARBY_LOST_PET_RADIUS_KM: ${NEARBY_LOST_PET_RADIUS_KM:-10}
      NEARBY_LOST_PET_ALERT_COOLDOWN_HOURS: ${NEARBY_LOST_PET_ALERT_COOLDOWN_HOURS:-6}
      NEARBY_LOST_PET_REBROADCAST_MIN_DISTANCE_KM: ${NEARBY_LOST_PET_REBROADCAST_MIN_DISTANCE_KM:-2}
      NEARBY_ALERT_LOCATION_MAX_AGE_DAYS: ${NEARBY_ALERT_LOCATION_MAX_AGE_DAYS:-30}

    volumes:
      - ./backend/uploads:/app/uploads

    depends_on:
      db:
        condition: service_healthy

volumes:
  timan_mysql_data:
